
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excluir Lojas</title>

    <link href="https://fonts.googleapis.com/css?family=Quicksand" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f2f5f8;
        }

        .container {
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h3 class="text-center">Lojas Cadastradas</h3>
        <p class="text-center">Gerencie as lojas da plataforma.</p>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>Nome da Loja</th>
                    <th>CNPJ</th>
                    <th>E-mail</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="cliente : ${clientes}">

                    <td th:text="${cliente.nome}"></td>

                    <td th:text="${cliente.cnpj}"></td>

                    <td th:text="${cliente.email}"></td>

                    <td>
                        <form th:action="@{/adm/deletarClientes/{id}(id=${cliente.id})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-danger"
                                    onclick="return confirm('Deseja realmente excluir esta loja?')">
                                Excluir
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="4" class="text-center">
                        Nenhuma loja cadastrada.
                    </td>
                </tr>

            </tbody>

        </table>

        <a href="/adm/dashboard" class="btn btn-secondary">
            Voltar
        </a>

    </div>

</body>
</html>
