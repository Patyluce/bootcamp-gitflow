
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Loja</title>

    <link href="https://fonts.googleapis.com/css?family=Quicksand" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f2f5f8;
        }

        .formulario {
            width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        input, select {
            margin-bottom: 12px;
        }

        button {
            background-color: #00AFEF !important;
            border: none !important;
        }
    </style>
</head>

<body>

    <div class="formulario">

        <h3 class="text-center">Cadastrar Loja</h3>
        <p class="text-center">Preencha os dados da nova loja.</p>

        <form th:object="${cadastro}"
              th:action="@{/adm/cadastrarClientes}"
              method="post">

            <input type="text" class="form-control"
                   placeholder="Nome/Razão social"
                   th:field="*{nome}" required>

            <input type="text" class="form-control"
                   placeholder="CNPJ"
                   th:field="*{cnpj}" required>

            <input type="email" class="form-control"
                   placeholder="E-mail"
                   th:field="*{email}" required>

            <input type="password" class="form-control"
                   placeholder="Senha"
                   th:field="*{senha}" required>

            <input type="text" class="form-control"
                   placeholder="CEP"
                   th:field="*{cep}" required>

            <select class="form-select" th:field="*{categoria}" required>
                <option value="">Selecione a categoria</option>
                <option value="beleza">Beleza</option>
                <option value="eletrodomesticos">Eletrodomésticos</option>
                <option value="construcao">Construção</option>
            </select>

            <select class="form-select" th:field="*{bairro}" required>
                <option value="">Selecione o bairro</option>
                <option value="Casa Amarela">Casa Amarela</option>
                <option value="Casa Forte">Casa Forte</option>
                <option value="Morro da Conceicao">Morro da Conceição</option>
                <option value="Boa Viagem">Boa Viagem</option>
                <option value="Pina">Pina</option>
            </select>

            <button type="submit" class="btn btn-primary w-100">
                Cadastrar Loja
            </button>

        </form>

        <br>

        <a href="/adm/dashboard" class="btn btn-secondary w-100">
            Voltar
        </a>

    </div>

</body>
</html>
