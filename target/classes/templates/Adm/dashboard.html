
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel ADM</title>

    <link href="https://fonts.googleapis.com/css?family=Quicksand" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f2f5f8;
        }

        .painel {
            width: 80%;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        .opcao {
            display: inline-block;
            width: 220px;
            padding: 30px;
            margin: 15px;
            background: #00AFEF;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
        }

        .opcao:hover {
            background: #008cbe;
            color: white;
        }
    </style>
</head>

<body>

    <div class="painel">
        <h2>Painel do Administrador</h2>
        <p>Bem-vindo! Escolha uma opção abaixo.</p>

        <br>

        <a href="/adm/cadastrarClientes" class="opcao">
            Cadastrar Lojas
        </a>

        <a href="/adm/deletarClientes" class="opcao">
            Excluir Lojas
        </a>

        <br><br>

        <a href="/" class="btn btn-secondary">Sair</a>
    </div>

</body>
</html>
